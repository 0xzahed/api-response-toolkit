[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "api-response-toolkit"
version = "0.1.0"
description = "A lightweight, clean, extensible API response standardization toolkit for Python, Django, and Django REST Framework."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Zahed", email = "zahed@example.com"},
]
requires-python = ">=3.9"
keywords = [
    "api",
    "response",
    "toolkit",
    "django",
    "drf",
    "rest",
    "standardization",
    "json",
    "error-handling",
    "pagination",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.optional-dependencies]
django = [
    "Django>=4.2",
]
drf = [
    "Django>=4.2",
    "djangorestframework>=3.14",
]
all = [
    "Django>=4.2",
    "djangorestframework>=3.14",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-django>=4.5",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "build>=1.0",
    "twine>=4.0",
]

[project.urls]
"Homepage" = "https://github.com/0xzahed/api-response-toolkit"
"Repository" = "https://github.com/0xzahed/api-response-toolkit"
"Documentation" = "https://github.com/0xzahed/api-response-toolkit#readme"
"Changelog" = "https://github.com/0xzahed/api-response-toolkit/blob/main/CHANGELOG.md"
"Issues" = "https://github.com/0xzahed/api-response-toolkit/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
api_response_toolkit = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:pkg_resources.*",
]

[tool.coverage.run]
source = ["api_response_toolkit"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"examples/**" = ["S101"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["django.*", "rest_framework.*"]
ignore_missing_imports = true
